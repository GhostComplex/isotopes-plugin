<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Pet</title>
  <link rel="stylesheet" href="/ui/pet/style.css">
</head>
<body>
  <!-- Top browser-like bar -->
  <div id="top-bar">
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="title-bar">
      <strong>Bangboo Terminal</strong>
      <span class="sep">/</span>
      <span class="subtitle">v0.1.0</span>
    </div>
    <button id="clear-btn">CLR</button>
    <button id="chat-toggle">COMMS</button>
  </div>

  <!-- Main frame -->
  <div id="frame">
    <div class="scanlines"></div>

    <!-- Title area -->
    <div id="title-area">
      <h1>BANGBOO <span class="blink">_</span></h1>
      <div class="subtitle-row">
        <span class="tag">UNIT-07</span>
        <span class="tag orange">ACTIVE</span>
      </div>
    </div>

    <!-- Main content -->
    <div id="content-grid">
      <!-- Left: agent status panel -->
      <div class="panel panel-left">
        <div class="panel-header">AGENTS</div>

        <div class="agent-card" data-agent="eous">
          <div class="agent-card-header">
            <span class="agent-card-name">EOUS</span>
            <span class="agent-card-status" id="status-eous">IDLE</span>
          </div>
          <div class="stat-row"><span class="stat-key">CTX</span><span class="stat-bar"><span class="bar-fill hp agent-ctx-bar" style="width:100%"></span></span></div>
          <div class="stat-row"><span class="stat-key">MSG</span><span class="stat-val agent-msg-count">0</span></div>
          <div class="stat-row"><span class="stat-key">SES</span><span class="stat-val agent-session-id">—</span></div>
        </div>

        <div class="agent-card" data-agent="amillion">
          <div class="agent-card-header">
            <span class="agent-card-name">AMILLION</span>
            <span class="agent-card-status" id="status-amillion">IDLE</span>
          </div>
          <div class="stat-row"><span class="stat-key">CTX</span><span class="stat-bar"><span class="bar-fill hp agent-ctx-bar" style="width:100%"></span></span></div>
          <div class="stat-row"><span class="stat-key">MSG</span><span class="stat-val agent-msg-count">0</span></div>
          <div class="stat-row"><span class="stat-key">SES</span><span class="stat-val agent-session-id">—</span></div>
        </div>

        <div class="agent-card" data-agent="penguin">
          <div class="agent-card-header">
            <span class="agent-card-name">PENGUIN</span>
            <span class="agent-card-status" id="status-penguin">IDLE</span>
          </div>
          <div class="stat-row"><span class="stat-key">CTX</span><span class="stat-bar"><span class="bar-fill hp agent-ctx-bar" style="width:100%"></span></span></div>
          <div class="stat-row"><span class="stat-key">MSG</span><span class="stat-val agent-msg-count">0</span></div>
          <div class="stat-row"><span class="stat-key">SES</span><span class="stat-val agent-session-id">—</span></div>
        </div>
      </div>

      <!-- Center: pet display -->
      <div class="panel panel-center">
        <!-- Pixel grid background -->
        <div class="pixel-grid-bg"></div>

        <!-- New Eridu top-down map -->
        <div class="street-scene">
          <div class="map-ground"></div>

          <!-- 便利店 (top-left) -->
          <div class="px-bldg bldg-ramen" style="top:15%;left:4%;transform:scale(1.8);transform-origin:top left">
            <div class="rooftop"></div>
            <div class="pipe"></div>
            <div class="wall"></div>
            <div class="sign">便利店</div>
            <div class="awning"></div>
            <div class="win" style="bottom:4px;left:6px"></div>
            <div class="win" style="bottom:4px;right:6px"></div>
            <div class="door"></div>
            <div class="lantern" style="bottom:22px;left:2px;animation-delay:0.3s"></div>
            <div class="lantern" style="bottom:22px;right:2px;animation-delay:0.8s"></div>
          </div>

          <!-- COFFEE SHOP (top-right) -->
          <div class="px-bldg bldg-coffee" style="top:8%;right:2%;transform:scale(1.8);transform-origin:top right">
            <div class="rooftop"></div>
            <div class="pipe"></div>
            <div class="badge">24</div>
            <div class="billboard"></div>
            <div class="wall"></div>
            <div class="glass" style="bottom:4px;left:8px"></div>
            <div class="glass" style="bottom:4px;left:28px"></div>
            <div class="glass" style="bottom:4px;right:8px"></div>
            <div class="sign">COFFEE</div>
          </div>

          <!-- MS (bottom-right) -->
          <div class="px-bldg bldg-chinese" style="bottom:8%;right:12%;transform:scale(1.8);transform-origin:bottom right">
            <div class="upper"></div>
            <div class="wall"></div>
            <div class="sign">食堂</div>
            <div class="poster"></div>
            <div class="lantern-string"></div>
            <div class="counter"></div>
            <div class="stool" style="bottom:-4px;left:26px"></div>
            <div class="stool" style="bottom:-4px;left:38px"></div>
            <div class="stool" style="bottom:-4px;left:50px"></div>
            <div class="stool" style="bottom:-4px;left:62px"></div>
          </div>

          <!-- GYM (bottom-left) -->
          <div class="px-bldg bldg-tech" style="bottom:4%;left:12%;transform:scale(1.8);transform-origin:bottom left">
            <div class="rooftop"></div>
            <div class="wall"></div>
            <div class="sign">GYM</div>
            <div class="screen" style="bottom:20px;left:28px;animation-delay:0.5s"></div>
            <div class="screen" style="bottom:20px;right:10px;animation-delay:2s"></div>
            <div class="cable" style="top:12px;right:6px;height:20px"></div>
            <div class="cable" style="top:12px;right:10px;height:16px"></div>
          </div>

          <!-- ARCADE — large complex building (center-top) -->
          <div class="px-bldg bldg-arcade" style="top:0%;left:38%;transform:scale(1.9);transform-origin:top left">
            <div class="arcade-upper"></div>
            <div class="arcade-wall"></div>
            <div class="arcade-sign">MS</div>
            <div class="arcade-marquee"></div>
            <div class="arcade-screen" style="bottom:18px;left:8px"></div>
            <div class="arcade-screen" style="bottom:18px;left:26px;animation-delay:1.2s"></div>
            <div class="arcade-screen" style="bottom:18px;right:8px;animation-delay:0.6s"></div>
            <div class="arcade-door"></div>
            <div class="arcade-ac"></div>
            <div class="arcade-ac" style="left:70px;top:2px"></div>
            <div class="arcade-pipe"></div>
            <div class="arcade-vent"></div>
            <div class="arcade-neon"></div>
            <div class="arcade-poster" style="top:28px;left:4px"></div>
            <div class="arcade-poster" style="top:28px;right:4px;background:#4a3060;border-color:#3a2050"></div>
          </div>
        </div>

        <!-- Agents row -->
        <div id="agents-row">
          <div class="agent-slot" data-agent="eous">
            <div class="agent-pet">
              <img class="agent-gif" src="/ui/pet/gif/eous-idel.gif" draggable="false">
            </div>
            <div class="agent-name-tag">EOUS</div>
            <div class="agent-shadow"><div class="ctx-fill"></div></div>
          </div>
          <div class="agent-slot" data-agent="amillion">
            <div class="agent-pet">
              <img class="agent-gif" src="/ui/pet/gif/amillion-idel.gif" draggable="false">
            </div>
            <div class="agent-name-tag">AMILLION</div>
            <div class="agent-shadow"><div class="ctx-fill"></div></div>
          </div>
          <div class="agent-slot" data-agent="penguin">
            <div class="agent-pet">
              <img class="agent-gif" src="/ui/pet/gif/enguin-idel.gif" draggable="false">
            </div>
            <div class="agent-name-tag">PENGUIN</div>
            <div class="agent-shadow"><div class="ctx-fill"></div></div>
          </div>
        </div>
      </div>

      <!-- Right: chat tabs -->
      <div class="panel panel-right">
        <div class="chat-tabs">
          <div class="chat-tab" data-agent="group">
            <div class="chat-tab-label">GROUP</div>
            <div class="chat-tab-body">
              <div class="group-mute-bar">
                <button class="mute-toggle" data-agent="eous">EOUS</button>
                <button class="mute-toggle" data-agent="amillion">AMILLION</button>
                <button class="mute-toggle" data-agent="penguin">PENGUIN</button>
              </div>
              <div class="chat-tab-messages"></div>
              <form class="chat-tab-form">
                <input type="text" class="chat-tab-input" placeholder="> SAY TO ALL..." autocomplete="off">
                <button type="submit">▶</button>
              </form>
            </div>
          </div>
          <div class="chat-tab" data-agent="eous">
            <div class="chat-tab-label">EOUS</div>
            <div class="chat-tab-body">
              <div class="chat-tab-messages"></div>
              <form class="chat-tab-form">
                <input type="text" class="chat-tab-input" placeholder="> SAY..." autocomplete="off">
                <button type="submit">▶</button>
              </form>
            </div>
          </div>
          <div class="chat-tab" data-agent="amillion">
            <div class="chat-tab-label">AMILLION</div>
            <div class="chat-tab-body">
              <div class="chat-tab-messages"></div>
              <form class="chat-tab-form">
                <input type="text" class="chat-tab-input" placeholder="> SAY..." autocomplete="off">
                <button type="submit">▶</button>
              </form>
            </div>
          </div>
          <div class="chat-tab" data-agent="penguin">
            <div class="chat-tab-label">PENGUIN</div>
            <div class="chat-tab-body">
              <div class="chat-tab-messages"></div>
              <form class="chat-tab-form">
                <input type="text" class="chat-tab-input" placeholder="> SAY..." autocomplete="off">
                <button type="submit">▶</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div id="footer">
      <span>NEW ERIDU — LOGISTICS DIV.</span>
      <span class="footer-ver">SYS.8BIT</span>
    </div>
  </div>

  <!-- Speech bubble (floating over pet) -->
  <div id="speech-bubble" class="hidden"></div>

  <script src="/ui/pet/pet.js"></script>
</body>
</html>
